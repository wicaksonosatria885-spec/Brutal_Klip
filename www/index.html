<!-- MULAI MODUL RAPIHIN VT & RIWAYAT (SIAP TEMPEL) -->
<div id="brutal-vt-module" class="bk-vt-wrap">
  <style>
    .bk-vt-wrap {
      --bg-card: #18141c;
      --bg-panel: #110e14;
      --bg-input: #1f1a24;
      --border: rgba(255, 255, 255, 0.1);
      --accent: #f43f5e;
      --accent-soft: rgba(244, 63, 94, 0.16);
      --text: #f5f3f7;
      --muted: #a8a1b3;
      --ok: #34d399;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: var(--text);
      max-width: 920px;
      margin: 16px auto;
    }
    .bk-vt-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
    }
    .bk-vt-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      border-left: 4px solid var(--accent);
      padding-left: 12px;
    }
    .bk-vt-title {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }
    .bk-vt-sub {
      margin: 2px 0 0;
      font-size: 12px;
      color: var(--muted);
    }
    .bk-grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }
    .bk-field label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .bk-input, .bk-select, .bk-textarea {
      width: 100%;
      box-sizing: border-box;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      padding: 10px 12px;
      font-size: 13px;
      outline: none;
    }
    .bk-input:focus, .bk-select:focus, .bk-textarea:focus {
      border-color: var(--accent);
    }
    .bk-textarea {
      min-height: 110px;
      resize: vertical;
      line-height: 1.5;
    }
    .bk-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }
    .bk-btn {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.15s ease;
    }
    .bk-btn:active {
      transform: scale(0.98);
    }
    .bk-btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .bk-btn-ghost {
      background: var(--bg-input);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .bk-filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 18px 0 14px;
    }
    .bk-filter-bar .bk-input {
      flex: 1 1 240px;
    }
    .bk-filter-bar .bk-select {
      flex: 0 1 200px;
    }
    .bk-history-item {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .bk-item-top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .bk-hook-box {
      background: var(--accent-soft);
      border: 1px solid rgba(244, 63, 94, 0.35);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 10px;
    }
    .bk-box-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 4px;
      font-weight: 700;
    }
    .bk-hook-text {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.45;
      color: #fff;
      margin: 0;
    }
    .bk-desc-box {
      background: var(--bg-input);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 10px;
    }
    .bk-desc-text {
      margin: 0;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-line;
      color: var(--text);
    }
    .bk-item-footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }
    .bk-tags {
      font-size: 12px;
      color: var(--accent);
    }
    .bk-mini-btns {
      display: flex;
      gap: 6px;
    }
    .bk-mini-btn {
      background: var(--bg-card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 11px;
      cursor: pointer;
    }
    .bk-mini-btn.copied {
      border-color: var(--ok);
      color: var(--ok);
    }
    .bk-empty {
      text-align: center;
      padding: 24px;
      color: var(--muted);
      font-size: 13px;
      border: 1px dashed var(--border);
      border-radius: 12px;
    }
  </style>

  <div class="bk-vt-card">
    <div class="bk-vt-header">
      <div>
        <h2 class="bk-vt-title">Tempat Rapihin VT &amp; Riwayat</h2>
        <p class="bk-vt-sub">Baca brief dulu, lalu racik hook &amp; deskripsi VT dengan pembahasan baru yang tetap nyambung</p>
      </div>
    </div>

    <div class="bk-grid-2">
      <div class="bk-field">
        <label for="bk-judul">Judul / Topik Campaign</label>
        <input id="bk-judul" class="bk-input" type="text" placeholder="Contoh: KOL.ID X KAK PERMATA X KO LEO" />
      </div>
      <div class="bk-field">
        <label for="bk-tema">Gaya Pembahasan Fresh</label>
        <select id="bk-tema" class="bk-select">
          <option value="Santai & Penasaran">Santai &amp; Penasaran</option>
          <option value="To The Point">To The Point (Langsung Inti)</option>
          <option value="Obrolan Kreator">Obrolan Kreator</option>
          <option value="Sudut Pandang Baru">Sudut Pandang Baru</option>
        </select>
      </div>
    </div>

    <div class="bk-field">
      <label for="bk-brief">Kotak Brief (Pahami Aturan, Topik, &amp; Catatan Penting di Sini)</label>
      <textarea id="bk-brief" class="bk-textarea" placeholder="Tempel isi brief di sini. Sistem akan memahami topiknya dan menyusun hook serta deskripsi VT baru yang lebih fresh..."></textarea>
    </div>

    <div class="bk-field" style="margin-top: 10px;">
      <label for="bk-catatan-extra">Fokus / Catatan Tambahan VT (Opsional)</label>
      <input id="bk-catatan-extra" class="bk-input" type="text" placeholder="Contoh: Tekankan poin aman sesuai brief & ajakan cek detail di klip" />
    </div>

    <div class="bk-actions">
      <button id="bk-btn-generate" class="bk-btn bk-btn-primary" type="button">
        Racik Hook &amp; Deskripsi VT Fresh
      </button>
      <button id="bk-btn-clear-form" class="bk-btn bk-btn-ghost" type="button">
        Bersihkan Input
      </button>
    </div>

    <div class="bk-filter-bar">
      <input id="bk-search" class="bk-input" type="text" placeholder="Cari judul, hook, deskripsi VT, atau tagar..." />
      <select id="bk-filter-tema" class="bk-select">
        <option value="">Semua Gaya</option>
        <option value="Santai & Penasaran">Santai &amp; Penasaran</option>
        <option value="To The Point">To The Point</option>
        <option value="Obrolan Kreator">Obrolan Kreator</option>
        <option value="Sudut Pandang Baru">Sudut Pandang Baru</option>
      </select>
    </div>

    <div id="bk-history-list"></div>
  </div>

  <script>
    (function () {
      const STORAGE_KEY = "brutal_klip_vt_fresh_v1";

      const elJudul = document.getElementById("bk-judul");
      const elTema = document.getElementById("bk-tema");
      const elBrief = document.getElementById("bk-brief");
      const elExtra = document.getElementById("bk-catatan-extra");
      const elSearch = document.getElementById("bk-search");
      const elFilterTema = document.getElementById("bk-filter-tema");
      const elList = document.getElementById("bk-history-list");

      function loadItems() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          const parsed = raw ? JSON.parse(raw) : [];
          return Array.isArray(parsed) ? parsed : [];
        } catch (e) {
          return [];
        }
      }

      function saveItems(items) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
        } catch (e) {}
      }

      function extractFocus(judul, briefText) {
        const cleanJudul = (judul || "").trim();
        if (cleanJudul) return cleanJudul;

        const cleanBrief = (briefText || "").replace(/\s+/g, " ").trim();
        if (!cleanBrief) return "Topik VT";

        // Ambil frasa awal singkat sebelum kata pemisah panjang
        const cut = cleanBrief.split(/Deskripsi|Category|Platforms|note:|1\)|Hook/i)[0].trim();
        if (cut.length >= 4 && cut.length <= 55) return cut;

        const words = cleanBrief.split(" ").slice(0, 5).join(" ");
        return words || "Topik VT";
      }

      function buildFreshVT(judul, tema, briefText, extraText) {
        const fokus = extractFocus(judul, briefText);
        const extra = (extraText || "").trim();
        const lowerBrief = (briefText || "").toLowerCase();

        // Deteksi petunjuk ringan dari brief tanpa menyalin blok panjang
        const mentionsPlatform = lowerBrief.includes("tiktok") || lowerBrief.includes("instagram");
        const mentionsWajah = lowerBrief.includes("wajah") || lowerBrief.includes("narasumber") || lowerBrief.includes("persona");

        let hook = "";
        let desc = "";

        if (tema === "To The Point") {
          hook = `Inti pembahasan ${fokus} yang sering kelewat di klip singkat.`;
          desc = [
            `Pembahasan langsung ke pokoknya soal ${fokus} tanpa muter-muter.`,
            mentionsWajah ? `Disusun mengikuti aturan tampil & alur visual yang pas di brief.` : `Dirangkum agar pesan utamanya gampang ditangkap sejak detik awal.`,
            extra ? `Catatan: ${extra}.` : `Simak poin lengkapnya di cuplikan VT ini.`
          ].join("\n");
        } else if (tema === "Obrolan Kreator") {
          hook = `Jujur, cara bahas ${fokus} kayak gini jauh lebih enak ditonton.`;
          desc = [
            `Ngobrolin ulang sudut pandang ${fokus} dari kacamata kreator klip.`,
            mentionsPlatform ? `Dibikin ringan supaya pas buat ritme tontonan feed & video pendek.` : `Fokus ke alur cerita yang mengalir dan nggak terasa seperti jualan kaku.`,
            extra ? `Poin penting: ${extra}.` : `Cek detail pembahasannya di video.`
          ].join("\n");
        } else if (tema === "Sudut Pandang Baru") {
          hook = `Bukan cuma soal luarnya, ini sisi lain dari ${fokus} yang menarik dibahas.`;
          desc = [
            `Mengangkat pendekatan baru untuk ${fokus} berdasarkan poin utama di brief.`,
            `Disesuaikan biar tetap aman sesuai batasan brief tapi punya rasa pembahasan yang segar.`,
            extra ? `Fokus tambahan: ${extra}.` : `Tonton sampai akhir buat lihat ringkasannya.`
          ].join("\n");
        } else {
          // Santai & Penasaran
          hook = `Coba lihat dari sisi ini: ${fokus} ternyata bisa dibahas se-ringan ini.`;
          desc = [
            `Versi pembahasan baru tentang ${fokus} yang tetap mengacu ke isi brief.`,
            `Disusun ringkas dan santai supaya enak diikuti dari awal sampai penutup klip.`,
            extra ? `Catatan klip: ${extra}.` : `Lanjut di VT ini buat detailnya.`
          ].join("\n");
        }

        const slugTag = fokus
          .replace(/[^a-zA-Z0-9\s]/g, " ")
          .trim()
          .split(/\s+/)
          .filter(Boolean)
          .slice(0, 2)
          .map((w) => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase())
          .join("");

        const tags = `#BrutalKlip #FreshVT${slugTag ? " #" + slugTag : ""}`;

        return { hook, desc, tags, fokus };
      }

      function formatTime(date = new Date()) {
        const pad = (n) => String(n).padStart(2, "0");
        return `${pad(date.getDate())}/${pad(date.getMonth() + 1)}/${date.getFullYear()}, ${pad(date.getHours())}.${pad(date.getMinutes())}.${pad(date.getSeconds())}`;
      }

      function escapeHtml(str) {
        return String(str || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function render() {
        const items = loadItems();
        const q = (elSearch.value || "").toLowerCase().trim();
        const filterTema = elFilterTema.value;

        const filtered = items.filter((item) => {
          const matchTema = !filterTema || item.tema === filterTema;
          const hay = `${item.judul} ${item.hook} ${item.desc} ${item.tags}`.toLowerCase();
          const matchQ = !q || hay.includes(q);
          return matchTema && matchQ;
        });

        if (!filtered.length) {
          elList.innerHTML = `<div class="bk-empty">Belum ada hasil VT yang cocok. Tempel brief lalu klik <b>Racik Hook &amp; Deskripsi VT Fresh</b>.</div>`;
          return;
        }

        elList.innerHTML = filtered
          .map(
            (item) => `
          <article class="bk-history-item" data-id="${escapeHtml(item.id)}">
            <div class="bk-item-top">
              <strong>${escapeHtml(item.judul)}</strong>
              <span>${escapeHtml(item.tema)} • ${escapeHtml(item.waktu)}</span>
            </div>

            <div class="bk-hook-box">
              <div class="bk-box-label">Hook Fresh</div>
              <p class="bk-hook-text">${escapeHtml(item.hook)}</p>
            </div>

            <div class="bk-desc-box">
              <div class="bk-box-label">Deskripsi VT Fresh</div>
              <p class="bk-desc-text">${escapeHtml(item.desc)}</p>
            </div>

            <div class="bk-item-footer">
              <span class="bk-tags">${escapeHtml(item.tags)}</span>
              <div class="bk-mini-btns">
                <button type="button" class="bk-mini-btn" data-action="copy" data-id="${escapeHtml(item.id)}">Salin VT</button>
                <button type="button" class="bk-mini-btn" data-action="regen" data-id="${escapeHtml(item.id)}">Variasi Baru</button>
                <button type="button" class="bk-mini-btn" data-action="delete" data-id="${escapeHtml(item.id)}">Hapus</button>
              </div>
            </div>
          </article>
        `
          )
          .join("");
      }

      document.getElementById("bk-btn-generate").addEventListener("click", () => {
        const briefText = elBrief.value.trim();
        const judulInput = elJudul.value.trim();
        if (!briefText && !judulInput) {
          elBrief.focus();
          return;
        }

        const tema = elTema.value;
        const extra = elExtra.value.trim();
        const generated = buildFreshVT(judulInput, tema, briefText, extra);

        const items = loadItems();
        items.unshift({
          id: "vt_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6),
          judul: judulInput || generated.fokus,
          tema,
          brief: briefText,
          extra,
          hook: generated.hook,
          desc: generated.desc,
          tags: generated.tags,
          waktu: formatTime()
        });

        saveItems(items);
        render();
      });

      document.getElementById("bk-btn-clear-form").addEventListener("click", () => {
        elJudul.value = "";
        elBrief.value = "";
        elExtra.value = "";
      });

      elSearch.addEventListener("input", render);
      elFilterTema.addEventListener("change", render);

      elList.addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-action]");
        if (!btn) return;

        const action = btn.getAttribute("data-action");
        const id = btn.getAttribute("data-id");
        const items = loadItems();
        const idx = items.findIndex((x) => x.id === id);
        if (idx === -1) return;

        if (action === "delete") {
          items.splice(idx, 1);
          saveItems(items);
          render();
          return;
        }

        if (action === "copy") {
          const target = items[idx];
          const textToCopy = `HOOK:\n${target.hook}\n\nDESKRIPSI VT:\n${target.desc}\n\n${target.tags}`;
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(textToCopy).catch(() => {});
          }
          btn.textContent = "Tersalin";
          btn.classList.add("copied");
          setTimeout(() => {
            btn.textContent = "Salin VT";
            btn.classList.remove("copied");
          }, 1400);
          return;
        }

        if (action === "regen") {
          const cur = items[idx];
          const next = buildFreshVT(cur.judul, cur.tema, cur.brief, cur.extra);
          // Jika hook persis sama dengan sebelumnya, tambahkan variasi pembuka ringan
          const altHook =
            next.hook === cur.hook
              ? `Coba cek bagian ini: ${next.hook.charAt(0).toLowerCase() + next.hook.slice(1)}`
              : next.hook;
          items[idx] = {
            ...cur,
            hook: altHook,
            desc: next.desc,
            tags: next.tags,
            waktu: formatTime()
          };
          saveItems(items);
          render();
        }
      });

      render();
    })();
  </script>
</div>
<!-- AKHIR MODUL RAPIHIN VT & RIWAYAT -->
