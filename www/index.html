<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brutal Klip</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    :root {
      --bg: #0b0f17;
      --card: #131a26;
      --card-2: #192232;
      --text: #f3f6fb;
      --muted: #94a3b8;
      --accent: #ef4444;
      --accent-hover: #dc2626;
      --border: rgba(255, 255, 255, 0.1);
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px 64px;
      font-family: "Segoe UI", Roboto, Inter, Arial, sans-serif;
      background: radial-gradient(circle at top, #1b2538 0%, var(--bg) 55%);
      color: var(--text);
      line-height: 1.5;
    }

    .wrap {
      max-width: 960px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
      padding: 16px 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .brand-header {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-logo {
      width: 52px;
      height: 52px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card-2);
    }

    .brand-header h1 {
      margin: 0;
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .subtitle {
      margin: 2px 0 0;
      font-size: 0.88rem;
      color: var(--muted);
    }

    .lang-group {
      display: flex;
      gap: 8px;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      margin-bottom: 16px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
    }

    .panel h2 {
      margin: 0 0 14px;
      font-size: 1.15rem;
      font-weight: 700;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    label {
      display: block;
      margin: 10px 0 6px;
      font-size: 0.88rem;
      font-weight: 600;
      color: #e2e8f0;
    }

    input[type="text"],
    input[type="password"],
    input[type="number"],
    select,
    textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card-2);
      color: var(--text);
      font-size: 0.94rem;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--accent);
    }

    textarea {
      min-height: 92px;
      resize: vertical;
    }

    input[type="file"] {
      width: 100%;
      padding: 8px;
      border-radius: 10px;
      border: 1px dashed var(--border);
      background: var(--card-2);
      color: var(--muted);
      font-size: 0.88rem;
    }

    .checks {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin: 14px 0 16px;
    }

    .checks label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: 0;
      font-weight: 500;
      cursor: pointer;
    }

    .checks input[type="checkbox"] {
      accent-color: var(--accent);
      transform: scale(1.1);
    }

    button {
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.12s ease;
    }

    button:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    button.secondary {
      background: var(--card-2);
      border: 1px solid var(--border);
      color: var(--text);
    }

    button.secondary.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    .status-text {
      margin: 10px 0 0;
      font-size: 0.88rem;
      color: var(--muted);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .stat-box {
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
    }

    .stat-label {
      font-size: 0.82rem;
      color: var(--muted);
    }

    .stat-val {
      margin-top: 4px;
      font-size: 1.35rem;
      font-weight: 800;
    }

    .filter-row {
      display: grid;
      grid-template-columns: 1fr 220px;
      gap: 12px;
      margin-bottom: 14px;
    }

    .vt-list {
      display: grid;
      gap: 12px;
    }

    .vt-item {
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
    }

    .vt-meta {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .vt-hook {
      font-weight: 700;
      margin-bottom: 6px;
    }

    .vt-tags {
      font-size: 0.85rem;
      color: #fca5a5;
    }

    @media (max-width: 720px) {
      .grid-2,
      .grid-3,
      .stats-grid,
      .filter-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <div class="brand-header">
        <img
          src="WhatsApp%20Image%202026-11-20%20at%2023.32.02.jpeg"
          alt="Logo Brutal Klip"
          class="brand-logo"
        />
        <div>
          <h1>Brutal Klip</h1>
          <p class="subtitle" id="subtitleText">Offline / Online Ready • 100% Gratis</p>
        </div>
      </div>

      <div class="lang-group">
        <button type="button" id="btnID" class="secondary active" onclick="setLang('id')">ID</button>
        <button type="button" id="btnEN" class="secondary" onclick="setLang('en')">EN</button>
      </div>
    </header>

    <section class="panel">
      <h2 id="titleAccount">Akun &amp; Sinkronisasi</h2>
      <div class="grid-3">
        <input type="text" id="accUser" placeholder="Email / ID Akun (HP &amp; PC)" />
        <input type="password" id="accPass" placeholder="Kata Sandi / Sync Key" />
        <button type="button" id="btnSaveAcc" onclick="saveAccount()">Masuk / Simpan</button>
      </div>
      <p class="status-text" id="accStatus">Belum masuk — data tersimpan lokal di perangkat.</p>
    </section>

    <section class="panel">
      <h2 id="titleBrief">Brief Campaign &amp; Generator VT</h2>
      <form id="briefForm" onsubmit="generateVTs(event)">
        <div class="grid-3">
          <div>
            <label for="projectName" id="lblProject">Nama Proyek / Batch</label>
            <input type="text" id="projectName" placeholder="Contoh: Campaign Kopi Pagi" required />
          </div>

          <div>
            <label for="vtCount" id="lblCount">Jumlah VT (5–50)</label>
            <input type="number" id="vtCount" min="5" max="50" value="10" required />
          </div>

          <div>
            <label for="themeSelect" id="lblTheme">Tema Editing</label>
            <select id="themeSelect">
              <option value="Komedi">Komedi</option>
              <option value="Horor">Horor</option>
              <option value="Natural / Organik">Natural / Organik</option>
            </select>
          </div>
        </div>

        <label for="sourceVideo" id="lblVideo">Unggah Video Sumber (Lokal)</label>
        <input type="file" id="sourceVideo" accept="video/*" />

        <label for="briefText" id="lblBrief">Isi Brief Campaign &amp; Instruksi</label>
        <textarea
          id="briefText"
          placeholder="Tulis brief campaign, poin wajib, larangan, gaya hook, dan jadwal upload..."
          required
        ></textarea>

        <div class="checks">
          <label><input type="checkbox" id="optSub" checked /> Auto Subtitle</label>
          <label><input type="checkbox" id="optEnhance" checked /> Jernihkan Video</label>
          <label><input type="checkbox" id="optFace" checked /> Deteksi Wajah / Pelacak Kamera</label>
          <label><input type="checkbox" id="optWm" checked /> Watermark</label>
          <label><input type="checkbox" id="optSched" checked /> Pengingat Jadwal</label>
        </div>

        <button type="submit" id="btnGenerate">Analisis Potensi FYP &amp; Buat Paket VT</button>
      </form>
    </section>

    <section class="panel">
      <h2 id="titleStats">Statistik Potensi FYP &amp; Retensi</h2>
      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-label" id="lblScore">Skor Potensi FYP</div>
          <div class="stat-val" id="statScore">-</div>
        </div>
        <div class="stat-box">
          <div class="stat-label" id="lblRetention">Estimasi Retensi 3 Detik</div>
          <div class="stat-val" id="statRetention">-</div>
        </div>
        <div class="stat-box">
          <div class="stat-label" id="lblTotalVT">Total Paket VT Tersimpan</div>
          <div class="stat-val" id="statTotalVT">0</div>
        </div>
      </div>
    </section>

    <section class="panel">
      <h2 id="titleHistory">Tempat Rapihin VT &amp; Riwayat</h2>
      <div class="filter-row">
        <input
          type="text"
          id="searchHistory"
          placeholder="Cari nama, hook, tagar..."
          oninput="renderHistory()"
        />
        <select id="filterTheme" onchange="renderHistory()">
          <option value="">Semua Tema</option>
          <option value="Komedi">Komedi</option>
          <option value="Horor">Horor</option>
          <option value="Natural / Organik">Natural / Organik</option>
        </select>
      </div>
      <div class="vt-list" id="vtList"></div>
    </section>
  </div>

  <script src="app.js"></script>
  <script>
    const STORAGE_KEY = "brutal_klip_data_v1";
    const ACC_KEY = "brutal_klip_acc_v1";

    function loadItems() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }

    function saveItems(items) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    }

    function saveAccount() {
      const user = document.getElementById("accUser").value.trim();
      const status = document.getElementById("accStatus");
      if (!user) {
        status.textContent = "Isi Email / ID Akun terlebih dahulu.";
        return;
      }
      localStorage.setItem(ACC_KEY, JSON.stringify({ user, updatedAt: new Date().toISOString() }));
      status.textContent = `Terhubung sebagai ${user} (tersimpan lokal di perangkat).`;
    }

    function setLang(lang) {
      document.getElementById("btnID").classList.toggle("active", lang === "id");
      document.getElementById("btnEN").classList.toggle("active", lang === "en");
      document.getElementById("subtitleText").textContent =
        lang === "en" ? "Offline / Online Ready • 100% Free" : "Offline / Online Ready • 100% Gratis";
    }

    function generateVTs(e) {
      e.preventDefault();
      const project = document.getElementById("projectName").value.trim();
      const count = Math.min(50, Math.max(5, Number(document.getElementById("vtCount").value) || 10));
      const theme = document.getElementById("themeSelect").value;
      const brief = document.getElementById("briefText").value.trim();
      const fileInput = document.getElementById("sourceVideo");
      const fileName = fileInput.files && fileInput.files[0] ? fileInput.files[0].name : "Tanpa file video";

      const score = Math.min(98, 76 + (brief.length % 19));
      const retention = Math.min(92, 64 + (count % 23));

      document.getElementById("statScore").textContent = `${score}/100`;
      document.getElementById("statRetention").textContent = `${retention}%`;

      const existing = loadItems();
      const nowStr = new Date().toLocaleString("id-ID");

      const created = [];
      for (let i = 1; i <= count; i++) {
        created.push({
          id: `${Date.now()}-${i}`,
          project,
          vtIndex: `VT #${i}`,
          theme,
          fileName,
          date: nowStr,
          hook: `[${theme}] ${project} — Hook bagian ${i}: ${brief.slice(0, 70)}...`,
          desc: `${brief} | Audio: Bebas Hak Cipta / Royalty Free`,
          tags: `#BrutalKlip #${theme.replace(/[^a-zA-Z0-9]/g, "")} #FYP #KlipPendek`
        });
      }

      const updated = [...created, ...existing];
      saveItems(updated);
      renderHistory();
    }

    function renderHistory() {
      const query = document.getElementById("searchHistory").value.trim().toLowerCase();
      const themeFilter = document.getElementById("filterTheme").value;
      const all = loadItems();

      document.getElementById("statTotalVT").textContent = String(all.length);

      const filtered = all.filter((item) => {
        const matchTheme = !themeFilter || item.theme === themeFilter;
        const hay = `${item.project} ${item.vtIndex} ${item.hook} ${item.tags} ${item.date}`.toLowerCase();
        const matchQuery = !query || hay.includes(query);
        return matchTheme && matchQuery;
      });

      const listEl = document.getElementById("vtList");
      if (!filtered.length) {
        listEl.innerHTML = `<p class="status-text">Belum ada paket VT yang cocok dengan filter.</p>`;
        return;
      }

      listEl.innerHTML = filtered
        .slice(0, 60)
        .map(
          (item) => `
          <div class="vt-item">
            <div class="vt-meta">${item.project} • ${item.vtIndex} • ${item.theme} • ${item.date}</div>
            <div class="vt-hook">${item.hook}</div>
            <div class="status-text">${item.desc}</div>
            <div class="vt-tags">${item.tags}</div>
          </div>
        `
        )
        .join("");
    }

    const savedAcc = (() => {
      try {
        return JSON.parse(localStorage.getItem(ACC_KEY));
      } catch {
        return null;
      }
    })();

    if (savedAcc && savedAcc.user) {
      document.getElementById("accUser").value = savedAcc.user;
      document.getElementById("accStatus").textContent = `Terhubung sebagai ${savedAcc.user} (tersimpan lokal di perangkat).`;
    }

    renderHistory();
  </script>
</body>
</html>
